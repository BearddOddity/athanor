<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athanor - Level Editor v3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-darker: #181818; --bg-dark: #1e1e1e; --bg-medium: #242424;
            --accent: #6aa84f; --accent-blue: #3d8bcf;
        }
        body { font-family: system-ui; background: var(--bg-darker); color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }
        .menubar { height: 48px; background: #262626; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #3a3a3a; }
        .menubar-brand { background: linear-gradient(135deg, var(--accent), var(--accent-blue)); color: white; padding: 6px 16px; border-radius: 6px; font-weight: 700; margin-right: 16px; }
        .menubar-item { padding: 8px 16px; cursor: pointer; color: #a0a0a0; border-radius: 6px; transition: 150ms; }
        .menubar-item:hover { background: #242424; color: #e0e0e0; }
        .editor-container { flex: 1; display: flex; }
        .sidebar { width: 260px; background: #1e1e1e; border-right: 1px solid #3a3a3a; display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px 16px; background: #242424; border-bottom: 1px solid #3a3a3a; display: flex; align-items: center; }
        .sidebar-header h3 { font-size: 14px; flex: 1; color: var(--accent-blue); }
        .panel { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 13px; }
        .node { padding: 6px 8px; margin: 2px 0; cursor: pointer; border-radius: 4px; }
        .node:hover { background: #262626; }
        .node.active { background: rgba(61, 139, 207, 0.2); border-left: 3px solid var(--accent-blue); }
        .center-area { display: flex; flex-direction: column; flex: 1; }
        .toolbar { background: #242424; padding: 8px 16px; border-bottom: 1px solid #3a3a3a; display: flex; gap: 8px; flex-wrap: wrap; }
        .tool-btn { padding: 8px 14px; border-radius: 6px; border: 1px solid #3a3a3a; background: #262626; color: #e0e0e0; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .tool-btn:hover { background: rgba(61, 139, 207, 0.2); border-color: var(--accent-blue); }
        .tool-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
        .viewport { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        canvas#webgl { width: 100%; height: 100%; display: block; min-width: 400px; min-height: 300px; }
        .inspector { width: 320px; background: #1e1e1e; border-left: 1px solid #3a3a3a; display: flex; flex-direction: column; }
        .inspector-header { padding: 12px 16px; background: #242424; border-bottom: 1px solid #3a3a3a; display: flex; align-items: center; }
        .inspector-header h3 { flex: 1; font-size: 14px; color: var(--accent-blue); }
        .inspector-content { flex: 1; overflow-y: auto; padding: 16px; font-size: 13px; }
        .prop-row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; margin-bottom: 8px; align-items: center; }
        .prop-label { color: #a0a0a0; font-weight: 500; }
        .prop-value { background: #262626; border: 1px solid #3a3a3a; border-radius: 6px; padding: 6px 10px; font-family: monospace; color: #e0e0e0; }
        .prop-value.input { min-width: 140px; }
        .button-group { display: flex; gap: 8px; margin-top: 16px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 500; transition: 150ms; display: flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-primary:hover { background: #4da3e0; }
        .btn-secondary { background: #262626; color: #e0e0e0; border: 1px solid #3a3a3a; }
        .btn-secondary:hover { background: rgba(61, 139, 207, 0.2); }
        .footer { height: 40px; background: #262626; border-top: 1px solid #3a3a3a; display: flex; align-items: center; padding: 0 16px; gap: 24px; font-size: 11px; color: #a0a0a0; }
    </style>
</head>
<body>
    <div class="menubar">
        <div class="menubar-brand">ATHANOR LEVEL EDITOR</div>
        <div class="menubar-item">File</div>
        <div class="menubar-item">Edit</div>
        <div class="menubar-item">Level</div>
        <div class="menubar-item">Tools</div>
        <div class="menubar-item" style="margin-left:auto;">Help</div>
    </div>
    <div class="editor-container">
        <div class="sidebar">
            <div class="sidebar-header"><h3>Hierarchy</h3></div>
            <div class="panel" id="hierarchy">
                <div class="node active"><span>📁</span> MainLevel</div>
                <div class="node"><span>📸</span> Camera</div>
                <div class="node"><span>💡</span> SunLight</div>
                <div class="node"><span>🗻</span> Ground</div>
                <div class="node"><span>🌲</span> Tree_01</div>
                <div class="node"><span>🪨</span> Rock_01</div>
            </div>
        </div>
        <div class="center-area">
            <div class="toolbar">
                <button class="tool-btn active" onclick="setTool('select')"><span>✋</span> Select</button>
                <button class="tool-btn" onclick="setTool('move')"><span>➡️</span> Move</button>
                <button class="tool-btn" onclick="setTool('rotate')"><span>🔄</span> Rotate</button>
                <button class="tool-btn" onclick="setTool('scale')"><span>↔️</span> Scale</button>
                <button class="tool-btn" onclick="addObject()"><span>➕</span> Add</button>
            </div>
            <div class="viewport">
                <canvas id="webgl"></canvas>
            </div>
        </div>
        <div class="inspector">
            <div class="inspector-header"><h3>Inspector</h3></div>
            <div class="inspector-content">
                <div class="inspector-section">
                    <h4 style="margin-bottom: 8px; color: var(--accent-blue); font-size: 12px;">Transform</h4>
                    <div class="prop-row"><span class="prop-label">Position</span><span class="prop-value input" id="position">0, 0, 0</span></div>
                    <div class="prop-row"><span class="prop-label">Rotation</span><span class="prop-value input" id="rotation">0, 0, 0</span></div>
                    <div class="prop-row"><span class="prop-label">Scale</span><span class="prop-value input" id="scale">1, 1, 1</span></div>
                </div>
                <div class="inspector-section">
                    <h4 style="margin-bottom: 8px; color: var(--accent-blue); font-size: 12px;">Properties</h4>
                    <div class="prop-row"><span class="prop-label">Name</span><span class="prop-value input" id="name">Ground</span></div>
                    <div class="prop-row"><span class="prop-label">Type</span><span class="prop-value" id="type">Plane</span></div>
                    <div class="prop-row"><span class="prop-label">Mesh</span><span class="prop-value input" id="mesh">ground_mesh</span></div>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="apply()">Apply</button>
                    <button class="btn btn-secondary" onclick="reset()">Reset</button>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        <div><span class="status-dot online"></span> Online</div>
        <div>FPS: <span id="fps">60</span></div>
        <div style="margin-left:auto;">Build 3.0</div>
    </div>

    <script>
        // Init WebGL
        const canvas = document.getElementById('webgl');
        const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
        
        function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        // Simple shader
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, 'attribute vec3 p;void main(){gl_Position=vec4(p,1.0);}');
        gl.compileShader(vs);
        
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, 'precision mediump float;uniform vec4 c;void main(){gl_FragColor=c;}');
        gl.compileShader(fs);
        
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        gl.useProgram(prog);

        const pLoc = gl.getAttribLocation(prog, 'p');
        const cLoc = gl.getUniformLocation(prog, 'c');
        
        // Simple objects
        let objects = [
            {name: 'Ground', pos: [0,-1,0], size: 25, color: [0.3,0.5,0.2]},
            {name: 'SunLight', pos: [5,5,5]}, {name: 'Camera', pos: [0,3,8]},
            {name: 'Tree', pos: [-5,-1,-3], size: 2, color: [0.2,0.6,0.2]},
            {name: 'Rock', pos: [3,-1,-2], size: 1, color: [0.4,0.4,0.4]}
        ];

        function draw() {
            gl.clearColor(0.05, 0.05, 0.1, 1);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);
            
            objects.forEach(o => {
                gl.uniform4f(cLoc, ...o.color, 1);
                const buf = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buf);
                const s = o.size || 1;
                const v = [
                    -s,-s,0, s,-s,0, s,s,0,
                    -s,-s,0, s,s,0, -s,s,0
                ];
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(v), gl.STATIC_DRAW);
                gl.enableVertexAttribArray(pLoc);
                gl.vertexAttribPointer(pLoc, 3, gl.FLOAT, false, 0, 0);
                gl.drawArrays(gl.TRIANGLES, 0, 6);
            });
        }

        // Controls
        let tool = 'select';
        function setTool(t) { tool = t; document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); }
        function addObject() { objects.push({name: 'Obj' + Date.now() % 1000, pos: [0,0,0], size: 1, color: [Math.random(), Math.random(), Math.random()]}); updateHierarchy(); }
        function updateHierarchy() {
            const h = document.getElementById('hierarchy');
            h.innerHTML = '<div class="node active"><span>📁</span> MainLevel</div>' + 
                objects.map((o, i) => '<div class="node" onclick="sel(' + i + ')"><span>' + objIcon(o) + '</span> ' + o.name + '</div>').join('');
        }
        function objIcon(o) { return o.type === 'light' ? '💡' : o.type === 'camera' ? '📸' : '🗻'; }
        
        let selIdx = 0;
        function sel(i) { selIdx = i; }
        function apply() { if (objects[selIdx]) { document.getElementById('name').value = objects[selIdx].name; } }
        function reset() { if (objects[selIdx]) { document.getElementById('name').value = objects[selIdx].name; document.getElementById('position').value = objects[selIdx].pos.join(', '); } }

        // FPS counter
        let fps = 0, t = 0;
        function loop(ts) { t++; if (t >= 60) { document.getElementById('fps').textContent = fps; t = 0; } fps = 0;
            draw(); requestAnimationFrame(loop); fps++; }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
