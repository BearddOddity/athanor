[package]
name = "athanor-core"
version = "0.1.0"
edition = "2021"
description = "Full-stack binary assembly, disassembly, and compilation engine for game formats"
license = "MIT"
repository = "https://github.com/BearddOddity/athanor"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
bytes = "1"
futures = "0.3"
chrono = "0.4"

[lib]
name = "athanor_core"
path = "src/lib.rs"

[[bin]]
name = "athanor"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true