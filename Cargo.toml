[package]
name = "athanor"
version = "0.1.0"
edition = "2021"
description = "Athanor Engine - Binary Assembly/Disassembly/Compilation Tool with GUI"
license = "MIT"
repository = "https://github.com/BearddOddity/athanor"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
bytes = "1"
futures = "0.3"
chrono = "0.4"
base64 = "0.21"
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

[lib]
name = "athanor_core"
path = "src-tauri/src/lib.rs"

[[bin]]
name = "athanor"
path = "src-tauri/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
incremental = true